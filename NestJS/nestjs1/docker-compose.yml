services:
  api:
    build:
      context: ./backend
    container_name: nestjs-api
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    # Dockerfile の CMD をそのまま使う
    #    CMD ["npm", "run", "start:dev"]
    # もし独自コマンドにしたい場合は下記をアンコメント
    # command: ["npm", "run", "start:dev"]
