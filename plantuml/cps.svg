th: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="249.5" x2="371.5" y1="590.9917" y2="590.9917"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="18" x="256.5" y="585.2477">OK</text><polygon fill="#A80036" points="72.5,619.8157,62.5,623.8157,72.5,627.8157,68.5,623.8157" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="66.5" x2="381.5" y1="623.8157" y2="623.8157"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="42" x="78.5" y="618.0717">200 OK</text><!--MD5=[212b88cfee684c6158ced3f575d04a99]
@startuml
participant Client
participant AuthService
participant Server
participant DB

group 認証
  Client -> AuthService: login(username, password)
  activate AuthService
  AuthService - -> Client: token
  deactivate AuthService
end group

loop リソースアクセスを繰り返す
  Client -> Server: GET /resource\nAuthorization: Bearer token
  activate Server
  alt token 有効
    Server -> DB: SELECT * FROM resource
    activate DB
    DB - -> Server: data
    deactivate DB
    Server - -> Client: 200 OK + data
  else token 無効
    Server - -> Client: 401 Unauthorized
    break
  end
  deactivate Server
end

opt ログアウト
  Client -> Server: POST /logout\nAuthorization: Bearer token
  activate Server
  Server - -> AuthService: invalidate(token)
  activate AuthService
  AuthService - -> Server: OK
  deactivate AuthService
  Server - -> Client: 200 OK
  deactivate Server
end

@enduml

