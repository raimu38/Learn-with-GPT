</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="168" x="11" y="429.4382">break if result == success</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="26" x="5" y="449.7101">end</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="0" x="8" y="469.9821"/><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="91" x="5" y="490.254">alt 支払い成功</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="74" x="11" y="510.5259">par DB登録</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="372" x="17" y="530.7978">Frontend -&gt; AppDB: insertSubscription(userId, planId)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="105" x="17" y="551.0697">activate AppDB</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="243" x="17" y="571.3416">AppDB --&gt; Frontend: subscriptionId</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="122" x="17" y="591.6135">deactivate AppDB</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="141" x="11" y="611.8854">and サービス呼び出し</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="94" x="8" y="632.1573">Syntax Error?</text><!--MD5=[e72ff40d9c5fa899daa20fb905035b98]
@startuml
title サブスクリプション購入ワークフロー
autonumber "<b>%d</b>"

actor User
participant Frontend
participant AuthService
participant SubscriptionService as SubSvc
boundary PaymentGateway
control EmailService
database AppDB

group セッション確認
  User -> Frontend: checkSession()
  activate Frontend
  Frontend -> AuthService: validate(token)
  activate AuthService
  AuthService - -> Frontend: OK／NG
  deactivate AuthService
  Frontend - -> User: sessionStatus
  deactivate Frontend
end group

group カート操作
  User -> Frontend: addToCart(itemId)
  activate Frontend
  Frontend - -> User: cartUpdated
  deactivate Frontend
end group

loop 支払い試行
  Frontend -> PaymentGateway: pay(amount)
  activate PaymentGateway
  PaymentGateway - -> Frontend: result
  deactivate PaymentGateway
  break if result == success
end

alt 支払い成功
  par DB登録
    Frontend -> AppDB: insertSubscription(userId, planId)
    activate AppDB
    AppDB - -> Frontend: subscriptionId
    deactivate AppDB
  and サービス呼び出し
    Frontend -> SubSvc: activateSubscription(subscriptionId)
    activate SubSvc
    SubSvc - -> Frontend: activated
    deactivate SubSvc
  end

  opt メール通知
    Frontend -> EmailService: sendSignupEmail(userId)
    activate EmailService
    EmailService - -> Frontend: emailSent
    deactivate EmailService
  end

  critical プランカウント更新
    Frontend -> AppDB: incrementPlanCount(planId)
  end

else 支払い失敗
  Frontend - -> User: paymentFailed
end

ref over SubSvc: サブスクリプション詳細フローは別図参照

note over User, Frontend
  ユーザーがサブスクリプションを購入する際の
  認証、カート操作、支払い、登録、通知を
  一連の流れで示しています。
end note

@enduml

